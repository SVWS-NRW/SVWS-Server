<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" th:with="istDruckausgabe = ${Parameter.istDruckausgabe()}">
	<head th:replace="~{fragments/reportHtmlHead :: htmlHead(
		title='Kurse mit Schülern',
		htmlTemplatePfad=${Parameter.htmlTemplateDefinition().getPfadHtmlTemplate()},
		namePageCSS='reporting-A4-hoch.css')}">
		<title></title>
	</head>

	<body th:with="KursplanungKurse = ${GostBlockungsergebnis.kurseGefiltert()}">
		<div class="reset-page-counter start-new-page" th:each="Kurs,iterationVarKurs : ${KursplanungKurse}">
			<!--Beginn: Definition der Seitenköpfe und Seitenfüße. Diese werden per CSS in den @page-Boxen positioniert-->
			<!--headerRight: Der Abschnitt und die Schulnummer werden über das Fragment hinzugefügt-->
			<th:block th:replace="~{fragments/reportPageHeaderFooter :: pageHeaderFooter(
				headerRight='Kurs: ' + ${Kurs.bezeichnung()} +
					'<br/>Lehrkräfte: ' + ${Kurs.lehrkraefteAuflistung()},
				footerRight='Druck ' + ${iterationVarKurs.count} + '/' + ${#lists.size(KursplanungKurse)})}">
			</th:block>
			<!--Ende: Definition Seitenköpfe und Seitenfüße -->

			<table class="fixed-100 p-0">
				<colgroup>
					<col style="width: 14%;" />
					<col style="width: 2%;" />
					<col style="width: 14%;" />
					<col style="width: 2%;" />
					<col style="width: 7%;" />
					<col style="width: 20%;" />
					<col style="width: 12%;" />
					<col style="width: 1%;" />
					<col style="width: 10%;" />
					<col style="width: 1%;" />
					<col style="width: 5%;" />
					<col style="width: 1%;" />
					<col style="width: 5%;" />
					<col style="width: 1%;" />
					<col style="width: 5%;" />
				</colgroup>
				<thead>
					<tr>
						<th colspan="15" class="bo-b-grey"><h2 th:text="'Kursplanung ' + ${Kurs.gostHalbjahr().kuerzel} + ' - Kursliste'">Kursplanung Q2.1 - Kursliste</h2></th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td colspan="15" class="p-t-25of100"></td>
					</tr>
					<tr>
						<td class="f-bold" th:text="${Kurs.bezeichnung()}">GE-GK2</td>
						<td></td>
						<td class="f-bold" th:text="${Kurs.lehrkraefteAuflistung()}">ABC</td>
						<td></td>
						<td class="f-bold" th:text="${Kurs.gostKursart().kuerzel}">GK</td>
						<td></td>
						<td class="f-small ta-c" th:text="(${Kurs.anzahlExterne()} == 0) ? ${Kurs.anzahlSchueler()} : ${Kurs.anzahlSchueler()} + ' (Ex. ' + ${Kurs.anzahlExterne()} + ')'">23 (Ext. 08)</td>
						<td></td>
						<td class="f-small ta-c" th:text="${Kurs.anzahlSchuelerSchriftlich()}">12</td>
						<td></td>
						<td class="f-small ta-c" th:text="${#strings.equalsIgnoreCase('E', Kurs.gostHalbjahr().kuerzel.charAt(0)) ? '' : Kurs.anzahlAB12()}">0</td>
						<td></td>
						<td class="f-small ta-c" th:utext="${#strings.equalsIgnoreCase('E', Kurs.gostHalbjahr().kuerzel.charAt(0)) ? '' : (Kurs.anzahlAB3() + (#strings.equalsIgnoreCase('1', Kurs.gostHalbjahr().kuerzel.charAt(1)) ? '<span style=\'font-size: 0.6em;\'> (Pl.)</span>'  : ''))}">5</td>
						<td></td>
						<td class="f-small ta-c" th:utext="${#strings.equalsIgnoreCase('E', Kurs.gostHalbjahr().kuerzel.charAt(0)) ? '' : (Kurs.anzahlAB4() + (#strings.equalsIgnoreCase('1', Kurs.gostHalbjahr().kuerzel.charAt(1)) ? '<span style=\'font-size: 0.6em;\'> (Pl.)</span>'  : ''))}">3</td>
					</tr>
					<tr>
						<td class="cell-small-grey">Kursbezeichnung</td>
						<td></td>
						<td class="cell-small-grey">Lehrkräfte</td>
						<td></td>
						<td class="cell-small-grey">Kursart</td>
						<td></td>
						<td class="cell-small-grey ta-c">Anzahl SuS.</td>
						<td></td>
						<td class="cell-small-grey ta-c">Klausurschr.</td>
						<td></td>
						<td class="cell-small-grey ta-c">AB1/2</td>
						<td></td>
						<td class="cell-small-grey ta-c">AB3</td>
						<td></td>
						<td class="cell-small-grey ta-c">AB4</td>
					</tr>
					<tr>
						<td colspan="15" class="p-b-25of100"></td>
					</tr>
				</tbody>
			</table>

			<table class="fixed-100 p-0">
				<colgroup>
					<col style="width: 5%;" />
					<col th:style="(${Kurs.anzahlExterne()} != 0) ? 'width: 38%;' : 'width: 50%;'" />
					<col th:if="(${Kurs.anzahlExterne()} != 0)" style="width: 12%;" />
					<col style="width: 11%;" />
					<col style="width: 11%" />
					<col style="width: 15%" />
					<col style="width: 8%" />
				</colgroup>
				<thead>
					<tr>
						<th class="head-small-grey ta-l">Nr.</th>
						<th class="head-small-grey ta-l">Name, Vorname</th>
						<th th:if="(${Kurs.anzahlExterne()} != 0)" class="head-small-grey ta-c">Ext. Schule</th>
						<th class="head-small-grey ta-c">Belegung</th>
						<th class="head-small-grey ta-c">Abiturfach</th>
						<th class="head-small-grey ta-c">Geburtsdatum</th>
						<th class="head-small-grey ta-c">Geschl.</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="Kursschueler,iterationVarSchueler : ${Kurs.schueler()}" th:classappend="${iterationVarSchueler.odd} ? 'bg-lightgrey'">
						<td class="bo-b-grey p-tb-0 p-lr-1 f-small c-grey" th:text="${#numbers.formatInteger(iterationVarSchueler.count,2)} + '.'">Nr.</td>
						<td class="bo-b-grey p-tb-0 p-lr-1" th:text="${Kursschueler.nachname()} + ', ' + ${Kursschueler.vorname()}">Mustermann, Max</td>
						<td th:if="(${Kurs.anzahlExterne()} != 0)" class="bo-b-grey p-tb-0 p-lr-1 ta-c" th:text="${Kursschueler.externeSchulNr()}">123456</td>
						<td class="bo-b-grey p-tb-0 p-lr-1 ta-c" th:text="${Kursschueler.getGostKursplanungKursbelegungById(Kurs.id()).hatGueltigeFachwahl() ? (Kursschueler.getGostKursplanungKursbelegungById(Kurs.id()).istSchriftlich() ? 's' : 'm') : 'ungültig'}">s</td>
						<td class="bo-b-grey p-tb-0 p-lr-1 ta-c" th:utext="${Kursschueler.getGostKursplanungKursbelegungById(Kurs.id()).hatGueltigeFachwahl() ? (#strings.equalsIgnoreCase('E', GostBlockungsergebnis.gostHalbjahr().kuerzel.charAt(0)) ? '' : (Kursschueler.getGostKursplanungKursbelegungById(Kurs.id()).abiturfach() + (((#strings.equalsIgnoreCase('1', GostBlockungsergebnis.gostHalbjahr().kuerzel.charAt(1)) && Kursschueler.getGostKursplanungKursbelegungById(Kurs.id()).abiturfach() > 2) ? '<span style=\'font-size: 0.6em;\'> (Planung)</span>'  : '')))) : 'ungültig'}">3</td>
						<td class="bo-b-grey p-tb-0 p-lr-1 ta-c" th:text="${#convert.toDateDE(Kursschueler.geburtsdatum())}">22.08.2008</td>
						<td class="bo-b-grey p-tb-0 p-lr-1 ta-c" th:text="${Kursschueler.geschlecht().kuerzel}">w</td>
					</tr>
				</tbody>
			</table>
		</div>
	</body>
</html>
