<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" th:with="istDruckausgabe = ${Parameter.istDruckausgabe()}">
    <!--/* @thymesVar id="#convert" type="de.svws_nrw.module.reporting.html.dialects.ConvertExpressionHelper" */-->
	<head th:replace="~{fragments/reportHtmlHead :: htmlHead(
		title='Fachwahlstatistiken',
		htmlTemplatePfad=${Parameter.reportVorlage().getPfadHtmlTemplate()},
		namePageCSS='reporting-A4-hoch.css')}">
		<title></title>
	</head>

	<body>
		<!--Beginn: Definition der Seitenköpfe und Seitenfüße. Diese werden per CSS in den @page-Boxen positioniert-->
		<!--headerRight: Der Abschnitt und die Schulnummer werden über das Fragment hinzugefügt-->
		<th:block th:replace="~{fragments/reportPageHeaderFooter :: pageHeaderFooter(
			headerRight='Fachwahlstatistiken')}">
		</th:block>
		<!--Ende: Definition Seitenköpfe und Seitenfüße -->

		<table class="fixed-100 p-0">
			<thead>
				<tr>
					<th class="bo-b-grey"><h2 th:text="'Laufbahnplanung Abitur ' + ${GostLaufbahnplanungAbiturjahrgangFachwahlstatistikenAbiturjahr} + ' - Übersicht der Fachwahlen'">Laufbahnplanung Abitur 2024 - Übersicht der Fachwahlen</h2></th>
				</tr>
			</thead>
		</table>

		<table class="fixed-100" style="margin-top: 20px; margin-bottom: 20px; border-collapse: collapse;">
			<colgroup>
				<col style="width: 15%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
				<col style="width: 5%;" />
			</colgroup>
			<thead>
				<tr>
					<th class="ta-l f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0"></th>
					<th colspan="2" class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">EF.1</th>
					<th colspan="2" class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">EF.2</th>
					<th colspan="2" class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">Q1.1</th>
					<th colspan="2" class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">Q1.2</th>
					<th colspan="3" class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">Q2.1</th>
					<th colspan="3" class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid; border-right: 1px grey solid;">Q2.2</th>
					<th colspan="3" class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid; border-right: 1px grey solid;">Abitur</th>
				</tr>
				<tr>
					<td class="ta-l f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">Fach</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">G</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">S</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">G</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">S</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">G</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">S</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">G</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">S</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">G</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">S</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">Z</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">G</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">S</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">Z</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;">L</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0">3</td>
					<td class="ta-c f-bold bo-b-black-strong p-tb-0 p-lr-1 m-0" style="border-right: 1px grey solid;">4</td>
				</tr>
			</thead>
			<tbody>
				<tr th:each="fachwahlstatistik : ${GostLaufbahnplanungAbiturjahrgangFachwahlstatistiken}"
					th:with="fwFach = ${fachwahlstatistik.fach()}, fwStatFach = ${fwFach != null ? fwFach.statistikfach() : null}, ef1 = ${fachwahlstatistik.ef1()}, ef2 = ${fachwahlstatistik.ef2()}, q11 = ${fachwahlstatistik.q11()}, q12 = ${fachwahlstatistik.q12()}, q21 = ${fachwahlstatistik.q21()}, q22 = ${fachwahlstatistik.q22()}"
					th:style="'background-color: ' + ${fwStatFach != null ? fwStatFach.htmlFarbeRGB() : ''} + ';'">
					<td class="ta-l bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${fwFach != null ? fwFach.kuerzel() : ''}">D</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;" th:text="${ef1 != null ? ef1.wahlenGK() : ''}">87</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${ef1 != null ? ef1.wahlenGKSchriftlich() : ''}">47</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;" th:text="${ef2 != null ? ef2.wahlenGK() : ''}">87</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${ef2 != null ? ef2.wahlenGKSchriftlich() : ''}">47</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;" th:text="${q11 != null ? q11.wahlenGK() : ''}">87</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${q11 != null ? q11.wahlenGKSchriftlich() : ''}">47</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;" th:text="${q12 != null ? q12.wahlenGK() : ''}">87</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${q12 != null ? q12.wahlenGKSchriftlich() : ''}">47</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;" th:text="${q21 != null ? q21.wahlenGK() : ''}">87</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${q21 != null ? q21.wahlenGKSchriftlich() : ''}">47</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${q21 != null ? q21.wahlenZK() : ''}">40</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;" th:text="${q22 != null ? q22.wahlenGK() : ''}">87</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${q22 != null ? q22.wahlenGKSchriftlich() : ''}">47</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${q22 != null ? q22.wahlenZK() : ''}">40</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" style="border-left: 1px grey solid;" th:text="${q22 != null ? q22.wahlenLK() : ''}">42</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" th:text="${q22 != null ? q22.wahlenAB3() : ''}">87</td>
					<td class="ta-c bo-b-grey p-tb-0 p-lr-1 m-0" style="border-right: 1px grey solid;" th:text="${q22 != null ? q22.wahlenAB4() : ''}">47</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
