plugins {
	id 'svws.gradle.node.plugin'
}

task lint(type: NpmRun) {
	group = "build"
	args = ["test:ts"]
}

task assembleUiHistoire(type: NpmRun) {
	dependsOn ':svws-openapi:assembleTranspiled'
	group = "build"
	args = ['story:build']
	inputs.files fileTree("$projectDir").matching { exclude "build", "dist", ".histoire" }
	outputs.dir file("$projectDir/.histoire")
}

task cleanUi(type: Delete) {
	delete file("$projectDir/dist"), file("$projectDir/.histoire")
}

clean.dependsOn cleanUi

task testUi(type: NpmRun) {
	dependsOn ':svws-openapi:assembleTranspiled'
	group = "testing"
	inputs.files fileTree(dir: "$projectDir/src").matching { exclude "**/*.md" },
		fileTree(dir: "$projectDir/test"),
		file("$projectDir/package.json"),
		file("$projectDir/vite.config.ts")
	outputs.dir file("$projectDir/build/testresults")
	args = [ 'test:coverage' ]
	def dirResults = file("$projectDir/build/testresults")
	doFirst {
		dirResults.mkdirs()
	}
}

test.dependsOn testUi
