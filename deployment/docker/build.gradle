import svws.gradle.docker.DockerCommands

dependencies {
	implementation project(':svws-server-app')
}


def registryInternalHost = providers.environmentVariable('DOCKER_REGISTRY_INTERNAL_HOST') as Provider<String>
def registryInternalUsername = providers.environmentVariable('DOCKER_REGISTRY_INTERNAL_USERNAME') as Provider<String>
def registryInternalToken = providers.environmentVariable('DOCKER_REGISTRY_INTERNAL_TOKEN') as Provider<String>

def registryDockerhubHost = providers.provider { 'docker.io' } as Provider<String>
def registryDockerhubUsername = providers.environmentVariable('DOCKER_REGISTRY_DOCKERHUB_USERNAME') as Provider<String>
def registryDockerhubToken = providers.environmentVariable('DOCKER_REGISTRY_DOCKERHUB_TOKEN') as Provider<String>

def svwsServerImage = "svwsnrw/svws-server"
def svwsServerLatestTag = "${svwsServerImage}:latest"
def svwsServerVersionTag = "${svwsServerImage}:${project.ext.svwsArtifactVersion}"

def dockerRunnerImage = "svwsnrw/dockerrunner"
def dockerRunner17Tag = "${dockerRunnerImage}:17"
def dockerRunner21Tag = "${dockerRunnerImage}:21"

/* Vorbereitung der Dateien im build-Ordner, um das SVWS-Docker-Image zu bauen. */
// Sync statt Copy: im Docker-Kontext dürfen nur die aktuellen Artefakte liegen (der Server startet mit Wildcards auf dem Classpath)
tasks.register('syncSvwsServerArtifacts', Sync) {
	group = "docker"
	description = 'Kopieren der aktuellen Server Artefakte'

	dependsOn(':svws-server-app:collectJars')
	dependsOn(':svws-webclient:client:doZip')
	dependsOn(':svws-webclient:admin:doZip')

	def classpathJars = configurations.runtimeClasspath
	def dockerAppDir = "$projectDir/build/svws/app"

	doFirst {
		mkdir "${projectDir}/build/svws/app/lib"
	}

	into "${projectDir}/build/svws"
	into("app/lib/") {
		from(classpathJars) {
			exclude "svws-*.jar"
		}
	}
	into("app/") {
		// Nur die svws-Jars der aktuellen Version, die auch zur Classpath des Moduls gehören
		from(project(':svws-server-app').layout.buildDirectory.dir('libs')) {
			include { f -> !f.isDirectory() && f.name.startsWith('svws-') && classpathJars.collect { t -> t.getName() }.contains(f.name) }
		}
		from "../../svws-webclient/client/build/SVWS-Client.zip", "../../svws-webclient/admin/build/SVWS-Admin-Client.zip"
	}
	into("/") {
		from "${projectDir}/svws/Dockerfile", "${projectDir}/svws/startup.sh", "${projectDir}/svws/svwsconfig-template.json", "${projectDir}/svws/svwsconfig-template-nodb.json"
	}
	// Alle Jars des Classpaths (svws-*.jar in app/, übrige in app/lib/) müssen enthalten sein, sonst startet der Server im Container nicht.
	doLast {
		def missing = classpathJars.collect { t -> t.getName() }.findAll { n ->
			!new File(n.startsWith('svws-') ? file(dockerAppDir) : file("${dockerAppDir}/lib"), n).exists()
		}
		if (!missing.isEmpty()) {
			throw new GradleException("Jars aus dem Classpath fehlen im Docker-Kontext (${dockerAppDir}): ${missing.join(', ')}")
		}
	}
}

/* Baut das svws-Docker-Image lokal mit der entsprechenden Version als Tag. */
tasks.register('buildSvwsServerVersion', Exec) {
	group = "docker"
	dependsOn syncSvwsServerArtifacts
	workingDir "${projectDir}/build/svws"

	DockerCommands.build(it, svwsServerVersionTag)
}

/* Baut das svws-Docker-Image lokal mit dem latest Tag. */
tasks.register('buildSvwsServerLatest', Exec) {
	group = "docker"
	dependsOn syncSvwsServerArtifacts
	workingDir "${projectDir}/build/svws"

	DockerCommands.build(it, svwsServerLatestTag)
}

/* Task führt ein Docker-Runner-17-Build per docker durch. */
tasks.register('buildDockerRunner17', Exec) {
	group = "docker"
	workingDir "${projectDir}/dockerrunner/17"

	DockerCommands.build(it, dockerRunner17Tag)
}

/* Task führt ein Docker-Runner-17 push auf Dockerhub durch */
tasks.register('publishDockerRunner17Dockerhub', Exec) {
	group = "docker"
	dependsOn buildDockerRunner17
	workingDir "${projectDir}/dockerrunner/17"

	DockerCommands.loginAndPush(it, dockerRunner17Tag, dockerRunner17Tag, registryDockerhubHost, registryDockerhubUsername, registryDockerhubToken)
}

/* Task führt ein Docker-Runner-21-Build per docker durch. */
tasks.register('buildDockerRunner21', Exec) {
	group = "docker"
	workingDir "${projectDir}/dockerrunner/21"

	DockerCommands.build(it, dockerRunner21Tag)
}

/* Task führt ein Docker-Runner-21 push auf Dockerhub durch */
tasks.register('publishDockerRunner21Dockerhub', Exec) {
	group = "docker"
	dependsOn buildDockerRunner21
	workingDir "${projectDir}/dockerrunner/21"

	DockerCommands.loginAndPush(it, dockerRunner21Tag, dockerRunner21Tag, registryDockerhubHost, registryDockerhubUsername, registryDockerhubToken)
}

/* Veröffentlicht das SVWS-Server-Image des aktuellen dev-Stands als Snapshot-Tag in der internen Registry (Harbor: <Host>/svwsnrw/svws-server:snapshot). */
tasks.register('publishSvwsServerInternalSnapshot', Exec) {
	group = "docker"
	dependsOn buildSvwsServerLatest
	workingDir "${projectDir}/build/svws"

	def internalSnapshotTag = registryInternalHost.map { host -> "${host}/${svwsServerImage}:snapshot".toString() }
	DockerCommands.loginAndPush(it, svwsServerLatestTag, internalSnapshotTag, registryInternalHost, registryInternalUsername, registryInternalToken)
}

/* Veröffentlicht das SVWS-Server-Image mit dem latest Tag in der internen Registry (Harbor: <Host>/svwsnrw/svws-server:latest). Wird nur beim Release verwendet. */
tasks.register('publishSvwsServerInternalLatest', Exec) {
	group = "docker"
	dependsOn buildSvwsServerLatest
	workingDir "${projectDir}/build/svws"

	def internalLatestTag = registryInternalHost.map { host -> "${host}/${svwsServerLatestTag}".toString() }
	DockerCommands.loginAndPush(it, svwsServerLatestTag, internalLatestTag, registryInternalHost, registryInternalUsername, registryInternalToken)
}

/* Veröffentlicht das SVWS-Server-Image mit dem versionierten Tag in der internen Registry (Harbor: <Host>/svwsnrw/svws-server:<Version>). */
tasks.register('publishSvwsServerInternalRelease', Exec) {
	group = "docker"
	dependsOn buildSvwsServerVersion
	workingDir "${projectDir}/build/svws"

	def internalVersionTag = registryInternalHost.map { host -> "${host}/${svwsServerVersionTag}".toString() }
	DockerCommands.loginAndPush(it, svwsServerVersionTag, internalVersionTag, registryInternalHost, registryInternalUsername, registryInternalToken)
}

/* Bezieht das SVWS-Server-Image mit dem latest Tag aus der internen Registry (Harbor), ohne es neu zu bauen. Das Image muss dort bereits veröffentlicht sein. */
tasks.register('pullSvwsServerInternalLatest', Exec) {
	group = "docker"

	def internalLatestTag = registryInternalHost.map { host -> "${host}/${svwsServerLatestTag}".toString() }
	DockerCommands.loginAndPull(it, internalLatestTag, svwsServerLatestTag, registryInternalHost, registryInternalUsername, registryInternalToken)
}

/* Bezieht das SVWS-Server-Image mit dem versionierten Tag aus der internen Registry (Harbor), ohne es neu zu bauen. Das Image muss dort bereits veröffentlicht sein. */
tasks.register('pullSvwsServerInternalRelease', Exec) {
	group = "docker"

	def internalVersionTag = registryInternalHost.map { host -> "${host}/${svwsServerVersionTag}".toString() }
	DockerCommands.loginAndPull(it, internalVersionTag, svwsServerVersionTag, registryInternalHost, registryInternalUsername, registryInternalToken)
}

/* Führt ein Docker-Push des aus Harbor bezogenen SVWS-Server-Images mit dem latest Tag zu Dockerhub durch. */
tasks.register('publishSvwsServerDockerhubLatest', Exec) {
	group = "docker"
	dependsOn pullSvwsServerInternalLatest

	DockerCommands.loginAndPush(it, svwsServerLatestTag, svwsServerLatestTag, registryDockerhubHost, registryDockerhubUsername, registryDockerhubToken)
}

/* Führt ein Docker-Push des aus Harbor bezogenen SVWS-Server-Images mit dem versionierten Tag zu Dockerhub durch. */
tasks.register('publishSvwsServerDockerhubRelease', Exec) {
	group = "docker"
	dependsOn pullSvwsServerInternalRelease

	DockerCommands.loginAndPush(it, svwsServerVersionTag, svwsServerVersionTag, registryDockerhubHost, registryDockerhubUsername, registryDockerhubToken)
}
