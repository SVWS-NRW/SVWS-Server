import java.nio.charset.StandardCharsets

dependencies {
	implementation project(':svws-server-app')
}


def registryInternalHost = providers.environmentVariable('DOCKER_REGISTRY_INTERNAL_HOST')
def registryInternalUsername = providers.environmentVariable('DOCKER_REGISTRY_INTERNAL_USERNAME')
def registryInternalToken = providers.environmentVariable('DOCKER_REGISTRY_INTERNAL_TOKEN')

def registryDockerhubHost = providers.provider { 'docker.io' }
def registryDockerhubUsername = providers.environmentVariable('DOCKER_REGISTRY_DOCKERHUB_USERNAME')
def registryDockerhubToken = providers.environmentVariable('DOCKER_REGISTRY_DOCKERHUB_TOKEN')

def svwsServerImage = "svwsnrw/svws-server"
def svwsServerLatestTag = "${svwsServerImage}:latest"
def svwsServerVersionTag = "${svwsServerImage}:${project.ext.svwsArtifactVersion}"

def dockerRunnerImage = "svwsnrw/dockerrunner"
def dockerRunner17Tag = "${dockerRunnerImage}:17"
def dockerRunner21Tag = "${dockerRunnerImage}:21"

def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')

def dockerBuild = { Exec exec, String imageTag ->
	if (isWindows) {
		exec.commandLine "cmd", "/c", "docker build . -t ${imageTag}"
	} else {
		exec.commandLine "sh", "-c", "docker build . -t ${imageTag}"
	}
}

// Login, optionales Tagging (wenn remoteTag vom lokalen imageTag abweicht) und Push laufen in einem Kommando,
// da ein zweiter commandLine-Aufruf den ersten überschreiben würde. Das Token wird über stdin an docker login übergeben.
// remoteTag ist ein String oder ein Provider<String> (erst zur Ausführung aufgelöst, z. B. wenn der Registry-Host im Tag steht).
def dockerLoginAndPush = { Exec exec, String imageTag, Object remoteTagOrProvider, Provider<String> registry, Provider<String> registryUsername, Provider<String> registryToken ->
	exec.doFirst {
		if (!registry.isPresent()) {
			throw new GradleException('Es existiert kein Host für die Registry.')
		}

		if (!registryUsername.isPresent()) {
			throw new GradleException('Es existiert kein Username für die Registry.')
		}

		if (!registryToken.isPresent()) {
			throw new GradleException('Es existiert kein Token für die Registry.')
		}

		def remoteTag = (remoteTagOrProvider instanceof Provider ? remoteTagOrProvider.get() : remoteTagOrProvider) as String

		println "Veröffentlichung des Images ${remoteTag} in die Registry ${registry.get()}"

		def loginCmd = "docker login ${registry.get()} --username ${registryUsername.get()} --password-stdin"
		def tagCmd = (imageTag == remoteTag) ? "" : " && docker tag ${imageTag} ${remoteTag}"
		def command = "${loginCmd}${tagCmd} && docker push ${remoteTag}"

		if (isWindows) {
			exec.commandLine "cmd", "/c", command
		} else {
			exec.commandLine "sh", "-c", command
		}

		exec.standardInput = new ByteArrayInputStream((registryToken.get() + System.lineSeparator()).getBytes(StandardCharsets.UTF_8) as byte[])
	}
}


/* Vorbereitung der Dateien im build-Ordner, um das SVWS-Docker-Image zu bauen. */
// Sync statt Copy: im Docker-Kontext dürfen nur die aktuellen Artefakte liegen (der Server startet mit Wildcards auf dem Classpath)
tasks.register('syncSvwsServerArtifacts', Sync) {
	group = "docker"
	description = 'Kopieren der aktuellen Server Artefakte'

	dependsOn(':svws-server-app:collectJars')
	dependsOn(':svws-webclient:client:doZip')
	dependsOn(':svws-webclient:admin:doZip')

	def classpathJars = configurations.runtimeClasspath
	def dockerAppDir = "$projectDir/build/svws/app"

	doFirst {
		mkdir "${projectDir}/build/svws/app/lib"
	}

	into "${projectDir}/build/svws"
	into("app/lib/") {
		from(classpathJars) {
			exclude "svws-*.jar"
		}
	}
	into("app/") {
		// Nur die svws-Jars der aktuellen Version, die auch zur Classpath des Moduls gehören
		from(project(':svws-server-app').layout.buildDirectory.dir('libs')) {
			include { f -> !f.isDirectory() && f.name.startsWith('svws-') && classpathJars.collect { t -> t.getName() }.contains(f.name) }
		}
		from "../../svws-webclient/client/build/SVWS-Client.zip", "../../svws-webclient/admin/build/SVWS-Admin-Client.zip"
	}
	into("/") {
		from "${projectDir}/svws/Dockerfile", "${projectDir}/svws/startup.sh", "${projectDir}/svws/svwsconfig-template.json", "${projectDir}/svws/svwsconfig-template-nodb.json"
	}
	// Alle Jars des Classpaths (svws-*.jar in app/, übrige in app/lib/) müssen enthalten sein, sonst startet der Server im Container nicht.
	doLast {
		def missing = classpathJars.collect { t -> t.getName() }.findAll { n ->
			!new File(n.startsWith('svws-') ? file(dockerAppDir) : file("${dockerAppDir}/lib"), n).exists()
		}
		if (!missing.isEmpty()) {
			throw new GradleException("Jars aus dem Classpath fehlen im Docker-Kontext (${dockerAppDir}): ${missing.join(', ')}")
		}
	}
}

/* Baut das svws-Docker-Image lokal mit der entsprechenden Version als Tag. */
tasks.register('buildSvwsServerVersion', Exec) {
	group = "docker"
	dependsOn syncSvwsServerArtifacts
	workingDir "${projectDir}/build/svws"

	dockerBuild(it, svwsServerVersionTag)
}

/* Baut das svws-Docker-Image lokal mit dem latest Tag. */
tasks.register('buildSvwsServerLatest', Exec) {
	group = "docker"
	dependsOn syncSvwsServerArtifacts
	workingDir "${projectDir}/build/svws"

	dockerBuild(it, svwsServerLatestTag)
}

/* Task führt ein Docker-Runner-17-Build per docker durch. */
tasks.register('buildDockerRunner17', Exec) {
	group = "docker"
	workingDir "${projectDir}/dockerrunner/17"

	dockerBuild(it, dockerRunner17Tag)
}

/* Task führt ein Docker-Runner-17 push auf Dockerhub durch */
tasks.register('publishDockerRunner17Dockerhub', Exec) {
	group = "docker"
	dependsOn buildDockerRunner17
	workingDir "${projectDir}/dockerrunner/17"

	dockerLoginAndPush(it, dockerRunner17Tag, dockerRunner17Tag, registryDockerhubHost, registryDockerhubUsername, registryDockerhubToken)
}

/* Task führt ein Docker-Runner-21-Build per docker durch. */
tasks.register('buildDockerRunner21', Exec) {
	group = "docker"
	workingDir "${projectDir}/dockerrunner/21"

	dockerBuild(it, dockerRunner21Tag)
}

/* Task führt ein Docker-Runner-21 push auf Dockerhub durch */
tasks.register('publishDockerRunner21Dockerhub', Exec) {
	group = "docker"
	dependsOn buildDockerRunner21
	workingDir "${projectDir}/dockerrunner/21"

	dockerLoginAndPush(it, dockerRunner21Tag, dockerRunner21Tag, registryDockerhubHost, registryDockerhubUsername, registryDockerhubToken)
}

/* Veröffentlicht das SVWS-Server-Image des aktuellen dev-Stands als Snapshot-Tag in der internen Registry (Harbor: <Host>/svwsnrw/svws-server:snapshot). */
tasks.register('publishSvwsServerInternalSnapshot', Exec) {
	group = "docker"
	dependsOn buildSvwsServerLatest
	workingDir "${projectDir}/build/svws"

	def internalSnapshotTag = registryInternalHost.map { host -> "${host}/${svwsServerImage}:snapshot".toString() }
	dockerLoginAndPush(it, svwsServerLatestTag, internalSnapshotTag, registryInternalHost, registryInternalUsername, registryInternalToken)
}

/* Veröffentlicht das SVWS-Server-Image mit dem latest Tag in der internen Registry (Harbor: <Host>/svwsnrw/svws-server:latest). Wird nur beim Release verwendet. */
tasks.register('publishSvwsServerInternalLatest', Exec) {
	group = "docker"
	dependsOn buildSvwsServerLatest
	workingDir "${projectDir}/build/svws"

	def internalLatestTag = registryInternalHost.map { host -> "${host}/${svwsServerLatestTag}".toString() }
	dockerLoginAndPush(it, svwsServerLatestTag, internalLatestTag, registryInternalHost, registryInternalUsername, registryInternalToken)
}

/* Veröffentlicht das SVWS-Server-Image mit dem versionierten Tag in der internen Registry (Harbor: <Host>/svwsnrw/svws-server:<Version>). */
tasks.register('publishSvwsServerInternalRelease', Exec) {
	group = "docker"
	dependsOn buildSvwsServerVersion
	workingDir "${projectDir}/build/svws"

	def internalVersionTag = registryInternalHost.map { host -> "${host}/${svwsServerVersionTag}".toString() }
	dockerLoginAndPush(it, svwsServerVersionTag, internalVersionTag, registryInternalHost, registryInternalUsername, registryInternalToken)
}

/* Führt ein Docker-Push mit dem SVWS-Server-Image mit dem latest Tag zu Dockerhub durch. */
tasks.register('publishSvwsServerDockerhubLatest', Exec) {
	group = "docker"
	dependsOn buildSvwsServerLatest
	workingDir "${projectDir}/build/svws"

	dockerLoginAndPush(it, svwsServerLatestTag, svwsServerLatestTag, registryDockerhubHost, registryDockerhubUsername, registryDockerhubToken)
}

/* Führt ein Docker-Push mit dem SVWS-Server-Image mit dem versionierten Tag zu Dockerhub durch. */
tasks.register('publishSvwsServerDockerhubRelease', Exec) {
	group = "docker"
	dependsOn buildSvwsServerVersion
	workingDir "${projectDir}/build/svws"

	dockerLoginAndPush(it, svwsServerVersionTag, svwsServerVersionTag, registryDockerhubHost, registryDockerhubUsername, registryDockerhubToken)
}
