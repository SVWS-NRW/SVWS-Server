Siehe dazu folgenden Auszug aus https://github.com/danfickle/openhtmltopdf/wiki/Custom-CSS-properties

-fs-table-paginate: paginate
This property will paginate a table by repeating the thead and tfoot elements on every page where the table rows appear.
There is a paginated table sample at the sandbox. Sadly, there are some known bugs with this property, especially with nested tables.
It is best used with the -fs-page-break-min-height property to avoid the thead sitting on a page by itself.

-fs-page-break-min-height: 1.5cm
This property, which takes a length, will attempt to stop a block or block-like box sitting at the bottom of a page by itself.
For example, if it is set to 2cm for a table and only 1cm of the table would fit on the page, a page break is inserted before the table to satisfy the constraint.
This property is similar to the orphans property but takes a length rather than a number of lines and is applicable to a wider range of boxes such as tables.

-fs-border-rendering: no-bevel
This property, which is set to auto by default, can be used to turn off bevels on borders for a box and its descendants (it inherits).
Unfortunately, bevels on a box, such as a table cell can cause viewers to anti-alias border lines.
This leads to ugly effects such as some borders, despite being the same width, looking thicker or thinner than others. See #752 for a screenshot.
This property was implemented in PR#761 and will be released in version 1.0.10. The property is only honored for solid borders with zero border-radius.
Example:
table {
  border-collapse: collapse;
  -fs-border-rendering: no-bevel;
}

-fs-max-justification-inter-char and -fs-max-justification-inter-word
These properties control the maximum extra space that the justification algorithm can use when text-align: justify is in effect.
The initial value for inter character space is 0.5 millimetres and inter word spacing is 2 centimetres.
These properties can only be used on block and block-like (such as table cells) elements. These properties inherit by default.
Note: These properties are instead of the text-justify property which only allows a on/off for inter-word/inter-char spacing rather than a configurable length.
 */
table {
    -fs-table-paginate: paginate;
	-fs-page-break-min-height: 4mm;
}

.reset-page-counter {
	-fs-page-sequence: start;
}

/* Grau hinterlegtes Formularfeld für einzutragende bzw. bescheinigte Werte (z. B. Schulbescheinigung, Zeugnisse).
   Schmale Box (~5.5mm): geringer vertikaler Innenabstand (0.75mm), line-height = min-height (4mm) zentriert
   die einzelne Textzeile vertikal in der Inhaltsbox; min-height hält leere Felder so hoch wie gefüllte.
   Feste mm-line-height macht die Feldhöhe zudem unabhängig vom umgebenden Zeilenkontext.
   position: relative verankert die Streichung leerer Felder (siehe .formularfeld:empty). */
.formularfeld {
	position: relative;
	display: inline-block;
	min-width: 30mm;
	min-height: 4mm;
	padding: 0.75mm 1.5mm;
	line-height: 4mm;
	background-color: #d9d9d9;
	vertical-align: middle;
}

/* Leeres Formularfeld wird mit einem durchgehenden Strich entwertet (kein einzutragender Wert).
   Statt CSS-Pseudoelementen (:empty/::before werden von openhtmltopdf nicht zuverlässig gerendert)
   wird hierfür im Template ein echtes <span class="formularfeld-strich"></span> als einziges Kind
   des leeren Feldes ausgegeben. Der Strich liegt vertikal mittig und ist links/rechts um den
   horizontalen Textabstand (1.5mm) eingerückt, sitzt also auf derselben Flucht wie ein eingetragener
   Wert. left + right (kein bottom) wegen der zuverlässigeren Absolutpositionierung in openhtmltopdf. */
.formularfeld-strich {
	display: block;
	position: absolute;
	left: 1.5mm;
	right: 1.5mm;
	/* Fester top-Wert statt 50%: openhtmltopdf löst Prozent-top nicht auf, wenn das (leere) Feld keine
	   definite Höhe hat. 0.75mm padding-top + halbe Textzeile (line-height 4mm / 2 = 2mm) = 2.75mm Textmitte;
	   abzüglich halber Strichstärke (0.1mm) liegt der Strich auf der Flucht eines eingetragenen Wertes. */
	top: 2.65mm;
	border-top: 0.2mm solid #000000;
}

Hier stehen nur die formatübergreifenden Regeln. Format-spezifische Werte (body-Breite/Padding, .start-new-page
margin-top sowie die background-size, top, left, right der Seitenumbruch-Lücke) werden in den jeweiligen
Format-CSS-Dateien (reporting-A4-hoch.css, reporting-A4-quer.css, …) gesetzt.
##########################################################################################################################
*/
@media screen {
	html {
		background: #c8c8c8;

		min-width: 100%;

	/* Die Lücke, die den Seitenumbruch als durchscheinenden Hintergrund darstellt.
	   background-size + top/left/right werden pro Format überschrieben. */
	.start-new-page::before {
		content: "";
		position: absolute;
		height: 5mm;
		background-color: #c8c8c8;
		background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.15) 0px, transparent 3px, transparent calc(100% - 3px), rgba(0, 0, 0, 0.15) 100%);
		background-position: center;
		background-repeat: no-repeat;
		z-index: 10;
	}
	.start-new-page::after {
		content: none;
	}
	.start-new-page:first-child {
		margin-top: 0;
	}
	.start-new-page:first-child::before {
