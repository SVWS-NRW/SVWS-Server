configurations {
	implementation.extendsFrom(crypto, database, jackson, jetty, resteasy, swagger, pdf)
	api
}

compileJava.dependsOn(":svws-db:assemble")
compileJava.dependsOn(":svws-db-utils:assemble")
compileJava.dependsOn(":svws-module-reporting:assemble")
compileJava.dependsOn(":svws-module-dav-api:assemble")

dependencies {
	implementation project(':svws-schulen')
	implementation project(':svws-asd')
	implementation project(':svws-core')
	implementation project(':svws-db')
	implementation project(':svws-db-dto')
	implementation project(':svws-db-utils')
	implementation project(':svws-module-reporting')
	implementation project(':svws-module-dav-api')

	api fileTree(dir: "$projectDir/src/main/java", includes: ['**/svws_nrw/api/server/*.java', '**/svws_nrw/api/privileged/API*.java', '**/svws_nrw/api/external/API*.java'])
}

/**
 * Der Gradle Task wird genutzt, um sich alle benötigten Dateien für die Auslieferung einer statischen SwaggerUI Seite mit Hilfe des SwaggerUIGenerators
 * generieren zu lassen.
 *
 * Hinweis: Um die Server URLs, die von Swagger für Test Requests genutzt werden, zu konfigurieren, kann die Umgebungsvariable SVWS_SWAGGER_UI_SERVER_URLS
 * beim Ausführen des Gradle Tasks gesetzt werden (Falls nicht gesetzt, Default: https://localhost).
 * Die Umgebungsvariable kann auch mehrere Server URLs kommagetrennt beinhalten. Beispiel: SVWS_SWAGGER_UI_SERVER_URLS="https://server1.de,https://server2.de"
 *
 * Des Weiteren lässt sich auch ein individuelles Output Verzeichnis über die Umgebungsvariable SVWS_SWAGGER_UI_OUTPUT_DIR definieren.
 * Beispiel: SVWS_SWAGGER_UI_OUTPUT_DIR="/temp/swagger-ui" (Falls nicht gesetzt, Default: "[buildOutputDir]/resources/main/swagger-ui").
 */
tasks.register('generateStaticSwaggerUI', JavaExec) {
	group = "publishing"
	description = "Erzeugt alle benötigten Ressourcen, um die SwaggerUI inklusive generierter OpenAPI Spezifikationen auszuliefern."
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "de.svws_nrw.api.common.SwaggerUIGenerator"

	String outputDir = System.getenv("SVWS_SWAGGER_UI_OUTPUT_DIR")
	// Als Default werden die Files in den Build Output geschrieben werden
	if (outputDir == null)
		outputDir = new File(project.getLayout().buildDirectory.getAsFile().get(), "resources/main/swagger-ui").absolutePath

	String swaggerServerUrls = System.getenv("SVWS_SWAGGER_UI_SERVER_URLS")
	// Bei lokalem Build soll als Default https://localhost in der SwaggerUI als Server genutzt werden
	if (swaggerServerUrls == null)
		swaggerServerUrls = "https://localhost"

	// Argumente für den SwaggerUIGenerator übergeben
	args outputDir, swaggerServerUrls
}

task cleanTranspiled(type: Delete) {
	group = "build"
	delete fileTree(dir: "$buildDir/tsapi"), fileTree(dir: "$buildDir/tmp/transpiler/tsapi", includes: ["**/*.class"])
}

task prepareTranspile {
	def fileTranspilerApiFiles = file("$buildDir/transpiler-api-files.txt")
	def configApi = configurations.api
	doLast {
		fileTranspilerApiFiles.text = configApi.files.toString().replace("[", "").replace("]", "").trim()
	}
	group = "build"
	dependsOn compileJava
	inputs.files configApi
	outputs.files fileTranspilerApiFiles
}

task transpile(type: JavaExec) {
	group = "build"
	dependsOn project(':svws-transpile').tasks.assemble
	dependsOn project(":svws-schulen").tasks.assemble
	dependsOn project(":svws-asd").tasks.assemble
	dependsOn project(":svws-core").tasks.assemble
	dependsOn compileJava
	dependsOn prepareTranspile
	inputs.files "$buildDir/transpiler-api-files.txt", configurations.api.files
	outputs.dir "$buildDir/tsapi"
	description = "Transpiliert den Java-Code nach Typescript"
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "de.svws_nrw.transpiler.app.GenerateTsOpenApi"
	args "--output", "$buildDir/tsapi",
		"--ignore", "de.svws_nrw",
		"--tmpdir", "$buildDir/tmp/transpiler/tsapi",
		"--files", "$buildDir/transpiler-api-files.txt"
	jvmArgs "--add-opens", "jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED"
	doFirst {
		def outputDir = file("$buildDir/tsapi")
		if (outputDir.exists())
			outputDir.deleteDir()
	}
}

task assembleTranspiled(type: Copy) {
	group = "build"
	dependsOn transpile
	inputs.dir "$rootDir/svws-schulen/build/ts"
	inputs.dir "$rootDir/svws-asd/build/ts"
	inputs.dir "$rootDir/svws-core/build/ts"
	inputs.dir "$buildDir/tsapi"
	outputs.dir "$rootDir/svws-webclient/core/src"
	from "$rootDir/svws-schulen/build/ts"
	from "$rootDir/svws-asd/build/ts"
	from "$rootDir/svws-core/build/ts"
	from "$buildDir/tsapi"
	into "$rootDir/svws-webclient/core/src"
	include "**/*.ts"
	exclude "index.ts"
	def fileIndexCombined = new File("$rootDir/svws-webclient/core/src/index.ts")
	def fileIndexSchule = file("$rootDir/svws-schulen/build/ts/index.ts")
	def fileIndexASD = file("$rootDir/svws-asd/build/ts/index.ts")
	def fileIndexCore = file("$rootDir/svws-core/build/ts/index.ts")
	def fileIndexApi = file("$buildDir/tsapi/index.ts")
	doLast {
		fileIndexCombined.text = "export { JsonCoreTypeReader } from './asd/utils/JsonCoreTypeReader';\n" +
			fileIndexSchule.getText() + fileIndexASD.getText() + fileIndexCore.getText() + fileIndexApi.getText()
	}
	doFirst {
		delete fileTree(dir: "$rootDir/svws-webclient/core/src", includes: [ "**/*.ts" ], excludes: [ "asd/utils/JsonCore*.ts", "**/*.test.ts", "test/**/*.ts" ])
	}
}

assemble.dependsOn assembleTranspiled



// TODO xml-apis belegt namespaces org.w3c.dom und javax.xml.namespace
// dies führt zu eclipse problemen (package accesible from more than one module),
// allerdings nicht zu problemen im gradle build.
// mit Herrn bachran absprechen, ob das so iO ist.
configurations.implementation {
	exclude group: 'xml-apis'
}

task createVersionProperties() {
	inputs.files "$rootDir/buildconfig.json"
	outputs.files "$projectDir/src/main/resources/config/version.properties"
	def data = "svws.version=" + project.version.toString() + "\n" +
		"schild.version=" + project.ext.schildMinVersion.toString() + "\n"
	def fileVersionProperties = file("src/main/resources/config/version.properties")
	doLast {
		fileVersionProperties.text = data
	}
}

processResources.dependsOn createVersionProperties
sourcesJar.dependsOn createVersionProperties

apply from: "$rootDir/publish-helper.gradle"
publishing {
	publications {
		publishJava(MavenPublication) {
			artifactId = 'svws-openapi'
			pom {
				name = 'SVWS OpenApi Library'
				description = 'Diese Bibliothek enthält die Java-Server-Definition der OpenApi-Schnittstelle für die Schulverwaltungssoftware in NRW'
			}
		}
	}
}

