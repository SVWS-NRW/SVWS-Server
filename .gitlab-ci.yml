# Source: https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Gradle.gitlab-ci.yml

# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Gradle.gitlab-ci.yml

# This is the Gradle build system for JVM applications
# https://gradle.org/
# https://github.com/gradle/gradle


image: ${REGISTRY_HOST}/svwsnrw/docker-runner:21

# Disable the Gradle daemon for Continuous Integration servers as correctness
# is usually a priority over speed in CI environments. Using a fresh
# runtime for each build is more reliable since the runtime is completely
# isolated from any previous builds.
variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache: &global_cache
    key: "$CI_COMMIT_REF_NAME"
    policy: pull-push
    paths:
        - ./**/build
        - .gradle_user
        - .gradle

stages:
    - lint
    - build
    - test
    - cleanup
    - analyze
    - package
    - sign
    - publish
    - scheduled

# ---------------------------------------------------------------
# JOB RULES
# ---------------------------------------------------------------
# läuft nur manuell (falls vorher keine anderen Regeln definiert wurden)
.rule_manual: &rule_manual
    when: manual

# läuft nicht in Branch Pipeline, wenn bereits ein offener MR existiert
.rule_no_branch_if_open_mr: &rule_no_branch_if_open_mr
    if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
    when: never

# läuft in MR-Pipeline
.rule_mr: &rule_mr
    if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'

# läuft in Branch Pipeline
.rule_branch: &rule_branch
    if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'

# läuft in Release Pipeline
.rule_release: &rule_release
    if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/ && $CI_PIPELINE_SOURCE != "schedule"'

# läuft nicht in Tag Pipeline
.rule_no_tag: &rule_no_tag
    if: $CI_COMMIT_TAG
    when: never

# läuft in dev Pipeline
.rule_dev: &rule_dev
    if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE != "schedule"'

# läuft in master Pipeline
.rule_master: &rule_master
    if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'

# läuft nur als Scheduled Pipeline mit Variable SCHEDULED_JOB_NAME="cleanup-sonarqube"
.rule_scheduled_cleanup_sonarqube: &rule_scheduled_cleanup_sonarqube
    if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB_NAME == "cleanup-sonarqube"'


lint:eslint:
    image: ${REGISTRY_HOST}/dockerhub_proxy/node:24-slim
    stage: lint
    interruptible: true
    before_script:
        - apt-get update
        - apt-get install -y git
        - rm -rf /var/lib/apt/lists/*
        - npm ci
    script:
        - time echo -e "svws-webclient/admin\nsvws-webclient/client\nsvws-webclient/ui\nsvws-webclient/enmserver\nsvws-webclient/laufbahnplanung" \
            | xargs -P5 -I{} npm --workspace {} run lint
    rules:
        - *rule_mr
        - *rule_no_branch_if_open_mr
        - *rule_branch

build:
    stage: build
    interruptible: true
    cache:
        <<: *global_cache
        policy: pull
    script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew --build-cache build -Penvironment=build
    artifacts:
        when: always
        reports:
            junit: ./**/build/test-results/test/**/TEST-*.xml
        paths:
            - "./**/build/**"
        exclude:
            - "./**/build/sonar/**"
        expire_in: "1 days"
    rules:
        - *rule_release
        - *rule_mr
        - *rule_no_branch_if_open_mr
        - *rule_branch

test:integration-tests:
    image: ${REGISTRY_HOST}/svws-ci/builder:jdk21-node24-playwright1.56
    stage: test
    dependencies:
        - build
    interruptible: false
    variables:
        USE_SYSTEM_NODE: "1" # Node aus dem Test-Runner Image wird verwendet und nicht erneut heruntergeladen
    before_script:
        - chmod +x ./.gitlab/.script/*.sh
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh

        - ./.gitlab/.script/docker_login.sh ${REGISTRY_HOST} ${REGISTRY_USER} ${REGISTRY_PASSWORD}
    script:
        ./gradlew --build-cache tests:integrationTest --stacktrace
    cache:
        <<: *global_cache
        policy: pull
    artifacts:
        when: always
        expire_in: "7 days"
        paths:
            - "**/tests/**/build/test-results/**"
        reports:
            junit: "**/tests/**/build/test-results/**/*.xml"
    rules:
        - *rule_release
        - *rule_mr
        - *rule_no_branch_if_open_mr
        - *rule_branch

cleanup:integration-tests:
    stage: cleanup
    needs:
        - test:integration-tests
    interruptible: false
    before_script:
        - chmod +x ./.gitlab/.script/*.sh
    script:
        - ./.gitlab/.script/cleanup_integration_test_container.sh ${CI_COMMIT_SHORT_SHA}
    rules:
        - *rule_release
        - *rule_mr
        - *rule_no_branch_if_open_mr
        - *rule_branch
    allow_failure: true

analyze:sonarqube:
    stage: analyze
    needs:
        - build
        - test:integration-tests
    interruptible: true
    variables:
        SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
        GIT_DEPTH: "0"
    script:
        - |
            if [[ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]]; then
                echo "Running SonarQube MR analysis for MR $CI_MERGE_REQUEST_IID"

                ./gradlew sonar \
                    -Dsonar.projectKey=svws-server \
                    -Dsonar.host.url=$SONAR_URL \
                    -Dsonar.token=$SONAR_TOKEN \
                    -Dsonar.pullrequest.key=$CI_MERGE_REQUEST_IID \
                    -Dsonar.pullrequest.branch=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME \
                    -Dsonar.pullrequest.base=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME \
                    -Dsonar.gradle.skipCompile=true \
                    -Dsonar.qualitygate.wait=true
            else
                echo "Running SonarQube branch analysis for Branch $CI_COMMIT_BRANCH"

                ./gradlew sonar \
                    -Dsonar.projectKey=svws-server \
                    -Dsonar.host.url=$SONAR_URL \
                    -Dsonar.token=$SONAR_TOKEN \
                    -Dsonar.branch.name=$CI_COMMIT_BRANCH \
                    -Dsonar.gradle.skipCompile=true \
                    -Dsonar.qualitygate.wait=true
            fi
    cache:
        key: "${CI_JOB_NAME}"
        paths:
            - .sonar/cache
    rules:
        - *rule_no_tag
        - *rule_dev
        - *rule_master
        - *rule_mr
        - *rule_no_branch_if_open_mr
        - *rule_manual
    allow_failure: true

package:installer:win:snapshot:
    image: ${REGISTRY_HOST}/svwsnrw/docker-runner-wine:21
    stage: package
    needs:
        - build
        - test:integration-tests
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - mkdir artifacts_windows
    script:
        - ./gradlew :deployment:windows-installer:doZip
    after_script:
        - cp ./deployment/windows-installer/build/output/win64-installer* ./artifacts_windows/
    cache:
        <<: *global_cache
        policy: pull
    artifacts:
        paths:
            - artifacts_windows/
    rules:
        - *rule_no_tag
        - *rule_no_branch_if_open_mr
        - *rule_manual
    allow_failure: true

package:installer:win:release:
    image: ${REGISTRY_HOST}/svwsnrw/docker-runner-wine:21
    stage: package
    needs:
        - build
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - mkdir artifacts_windows
    script:
        - ./gradlew :deployment:windows-installer:doZip
    after_script:
        - cp ./deployment/windows-installer/build/output/win64-installer* ./artifacts_windows/
    cache:
        <<: *global_cache
        policy: pull
    artifacts:
        paths:
            - artifacts_windows/
    rules:
        - *rule_release

package:installer:linux:release:
    stage: package
    needs:
        - build
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - mkdir artifacts_linux
    script:
        - ./gradlew :deployment:linux-installer:buildLinuxInstaller
    after_script:
        - cp -r ./deployment/linux-installer/build/distributions/ ./artifacts_linux
    cache:
        <<: *global_cache
        policy: pull
    artifacts:
        paths:
            - artifacts_linux/
    rules:
        - *rule_release

sign:installer:release:
    image: ${REGISTRY_HOST}/svwsnrw/docker-runner:17
    stage: sign
    needs:
        - build
        - package:installer:win:release
    before_script:
        - chmod u+x config/signing/*.sh
    script:
        - ./gradlew signWindowsInstaller
    cache:
        <<: *global_cache
        policy: pull
    artifacts:
        paths:
            - artifacts_windows/
            - artifacts_linux/
        exclude:
            - "./build/signing/**/*"
            - "./build/signing"
    rules:
        - *rule_release

publish:maven:internal:snapshot:
    stage: publish
    needs:
        - build
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh

        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
    script:
        - ./gradlew publishMavenInternalSnapshot
    rules:
        - *rule_dev

publish:maven:internal:release:
    stage: publish
    needs:
        - build
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh

        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
    script:
        - ./gradlew publishMavenInternalRelease
    rules:
        - *rule_release

publish:npm:internal:release:
    stage: publish
    needs:
        - build
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh

        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
    script:
        - ./gradlew publishNpmInternalRelease
    rules:
        - *rule_release

publish:npm:external:release:
    stage: publish
    needs:
        - build
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh

        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
    script:
        - ./gradlew publishNpmExternalRelease
    rules:
        - *rule_release

publish:docker:external:release:
    stage: publish
    needs:
        - build
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh

        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties

        - cat dockerlogin.txt | docker login --username svwsnrw --password-stdin
    script:
        - ./gradlew :deployment:docker:dockerPushAllDockerhub
    rules:
        - *rule_release

publish:bundle:external:release:
    stage: publish
    needs:
        - build
        - sign:installer:release
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    before_script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh

        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
    script:
        - ./gradlew :deployment:githubRelease
    rules:
        - *rule_release

scheduled:cleanup-sonarqube:
    stage: scheduled
    before_script:
        - chmod +x ./.gitlab/.script/cleanup_orphan_sonarqube_mr_analyses.sh
    script:
        - ./.gitlab/.script/cleanup_orphan_sonarqube_mr_analyses.sh
    rules:
        - *rule_scheduled_cleanup_sonarqube
