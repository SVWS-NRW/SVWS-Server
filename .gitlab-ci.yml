image: harbor.svws-nrw.de/svwsnrw/docker-runner:21

# Disable the Gradle daemon for Continuous Integration servers as correctness
# is usually a priority over speed in CI environments. Using a fresh
# runtime for each build is more reliable since the runtime is completely
# isolated from any previous builds.
variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache: &global_cache
    key: "$CI_COMMIT_REF_NAME"
    policy: pull-push
    paths:
        - ./**/build
        - .gradle_user
        - .gradle

stages:
    - lint
    - build
    - test
    - cleanup
    - analyze
    - build_snapshot_installer
    - build_installer
    - sign
    - publish
    - scheduled

lint:eslint:full:
    image: ${REGISTRY_HOST}/dockerhub_proxy/node:24-slim
    stage: lint
    interruptible: true
    before_script:
        - apt-get update
        - apt-get install -y git
        - rm -rf /var/lib/apt/lists/*

        - npm ci
    script:
        - time echo -e "svws-webclient/admin\nsvws-webclient/client\nsvws-webclient/ui\nsvws-webclient/enmserver\nsvws-webclient/laufbahnplanung" \
            | xargs -P5 -I{} npm --workspace {} run lint
    allow_failure: true
    rules:
        - if: $CI_COMMIT_BRANCH == 'dev' || $CI_COMMIT_BRANCH == 'master' #
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # läuft in MR-Pipeline
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # läuft nicht in Branch Pipeline, wenn bereits ein offener MR existiert
          when: never
        - when: manual # läuft sonst nur manuell

lint:eslint:changed:
    image: ${REGISTRY_HOST}/dockerhub_proxy/node:24-slim
    stage: lint
    interruptible: true
    variables:
        GIT_DEPTH: "0"
    before_script:
        - apt-get update
        - apt-get install -y git
        - rm -rf /var/lib/apt/lists/*

        - npm ci
    script:
        - |
            git fetch origin dev
            BASE=$(git merge-base HEAD origin/dev)
            # 1. Diff Files zwischen Branch Head <-> origin/dev Head ermitteln
            # 2. *.ts & *.vue Files inkludieren
            # 3. *.test.ts Files exkludieren
            CHANGED_FILES=$(git diff --diff-filter=d --name-only "$BASE" HEAD \
                | grep -E '\.ts$|\.vue$' \
                | grep -vE '\.test\.ts$' || true)

            if [ -n "$CHANGED_FILES" ]; then
              echo "Starte ESLint für geänderte Dateien:"
              echo "$CHANGED_FILES"
              npx eslint --ignore-pattern '**/svws-webclient/core/**/*' $CHANGED_FILES
            else
              echo "Keine Änderungen an .ts/.vue Dateien – Skip ESLint"
              exit 0
            fi
    rules:
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # läuft nicht in Branch Pipeline, wenn bereits ein offener MR existiert
          when: never
        - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != 'dev' && $CI_COMMIT_BRANCH != 'master' # läuft in Branch Pipelines außer "dev" oder "master"
        - when: never # läuft sonst nicht

build:
    stage: build
    interruptible: true
    cache:
        <<: *global_cache
        policy: pull
    script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew --build-cache build -Penvironment=build
    artifacts:
        when: always
        reports:
            junit: ./**/build/test-results/test/**/TEST-*.xml
        paths:
            - "./**/build/**"
        exclude:
            - "./**/build/sonar/**"
        expire_in: "1 days"
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/' # läuft in Release Pipeline
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # läuft in MR-Pipeline
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # läuft nicht in Branch Pipeline, wenn bereits ein offener MR existiert
          when: never
        - if: $CI_COMMIT_BRANCH # läuft in Branch Pipeline
        - when: never # läuft sonst nicht

test:integration-tests:
    image: ${REGISTRY_HOST}/svws-ci/test-runner:jdk21-node24-playwright1.56
    dependencies:
        - build
    stage: test
    interruptible: false
    variables:
        USE_SYSTEM_NODE: "1" # Node aus dem Test-Runner Image wird verwendet und nicht erneut heruntergeladen
    before_script:
        - chmod +x ./.gitlab/.script/*.sh
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh

        - ./.gitlab/.script/docker_login.sh ${REGISTRY_HOST} ${REGISTRY_USER} ${REGISTRY_PASSWORD}
    script:
          ./gradlew --build-cache tests:integrationTest --stacktrace
    cache:
        <<: *global_cache
        policy: pull
    artifacts:
        when: always
        expire_in: "7 days"
        paths:
            - "**/tests/**/build/test-results/**"
        reports:
            junit: "**/tests/**/build/test-results/**/*.xml"
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/' # läuft in Release Pipeline
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # läuft in MR-Pipeline
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # läuft nicht in Branch Pipeline, wenn bereits ein offener MR existiert
          when: never
        - if: $CI_COMMIT_BRANCH # läuft in Branch Pipeline
        - when: never # läuft sonst nicht

cleanup:integration-tests:
    stage: cleanup
    needs:
        - test:integration-tests
    interruptible: false
    before_script:
        - chmod +x ./.gitlab/.script/*.sh
    script:
        - ./.gitlab/.script/cleanup_integration_test_container.sh ${CI_COMMIT_SHORT_SHA}
    allow_failure: true
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/' # läuft in Release Pipeline
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # läuft in MR-Pipeline
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # läuft nicht in Branch Pipeline, wenn bereits ein offener MR existiert
          when: never
        - if: $CI_COMMIT_BRANCH # läuft in Branch Pipeline
        - when: never # läuft sonst nicht

analyze:sonarqube:
    stage: analyze
    interruptible: true
    needs:
        - job: build
          artifacts: true # benötigt sources und test-results
        - job: test:integration-tests
          artifacts: true # benötigt integration test-results
    variables:
        SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
        GIT_DEPTH: "0"
    script:
        - |
            if [[ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]]; then
                echo "Running SonarQube MR analysis for MR $CI_MERGE_REQUEST_IID"

                ./gradlew sonar \
                    -Dsonar.projectKey=svws-server \
                    -Dsonar.host.url=$SONAR_URL \
                    -Dsonar.token=$SONAR_TOKEN \
                    -Dsonar.pullrequest.key=$CI_MERGE_REQUEST_IID \
                    -Dsonar.pullrequest.branch=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME \
                    -Dsonar.pullrequest.base=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME \
                    -Dsonar.gradle.skipCompile=true \
                    -Dsonar.qualitygate.wait=true
            else
                echo "Running SonarQube branch analysis for Branch $CI_COMMIT_BRANCH"

                ./gradlew sonar \
                    -Dsonar.projectKey=svws-server \
                    -Dsonar.host.url=$SONAR_URL \
                    -Dsonar.token=$SONAR_TOKEN \
                    -Dsonar.branch.name=$CI_COMMIT_BRANCH \
                    -Dsonar.gradle.skipCompile=true \
                    -Dsonar.qualitygate.wait=true
            fi
    cache:
        key: "${CI_JOB_NAME}"
        paths:
            - .sonar/cache
    rules:
        - if: $CI_COMMIT_BRANCH == 'dev' || $CI_COMMIT_BRANCH == 'master' # läuft in dev & master Pipeline
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event' # läuft in MR-Pipeline
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # läuft nicht in Branch Pipeline, wenn bereits ein offener MR existiert
          when: never
        - when: manual # läuft sonst nur manuell
    allow_failure: true

build_snapshot_windows:
    stage: build_snapshot_installer
    needs:
        - build
        - test:integration-tests
    image: harbor.svws-nrw.de/svwsnrw/docker-runner-wine:21
    script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew :deployment:windows-installer:doZip
        - mkdir artifacts_windows
        - cp ./deployment/windows-installer/build/output/win64-installer* ./artifacts_windows/
    artifacts:
        paths:
            - artifacts_windows/
    allow_failure: true
    rules:
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # läuft nicht in Branch Pipeline, wenn bereits ein offener MR existiert
          when: never
        - when: manual # läuft sonst nur manuell

build_linux:
    stage: build_installer
    rules:
       - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
    needs:
        - job: build
    script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew :deployment:linux-installer:buildLinuxInstaller
        - mkdir artifacts_linux
        - cp -r ./deployment/linux-installer/build/distributions/ ./artifacts_linux
    artifacts:
        paths:
            - artifacts_linux/

build_windows:
    stage: build_installer
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
    needs:
        - job: build
    image: harbor.svws-nrw.de/svwsnrw/docker-runner-wine:21
    script:
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew :deployment:windows-installer:doZip
        - mkdir artifacts_windows
        - cp ./deployment/windows-installer/build/output/win64-installer* ./artifacts_windows/
    artifacts:
        paths:
            - artifacts_windows/

sign_artifacts:
    stage: sign
    image: harbor.svws-nrw.de/svwsnrw/docker-runner:17
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
    needs:
        - job: build
        - job: build_windows
        - job: build_linux
    before_script:
        - chmod u+x config/signing/*.sh
    script:
        - ./gradlew signJars signWindowsInstaller
    artifacts:
        paths:
            - artifacts_windows/
            - artifacts_linux/
        exclude:
            - "./build/signing/**/*"
            - "./build/signing"

publish_all:
    stage: publish
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    needs:
        - job: build
        - job: sign_artifacts
    script:
        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew publishReleaseAll

publish_maven:
    stage: publish
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    needs:
        - job: build
        - job: sign_artifacts
    script:
        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew publishAllPublicationsToSonatypeRepository closeAndReleaseSonatypeStagingRepository

publish_dockerhub:
    stage: publish
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    needs:
        - job: build
        - job: sign_artifacts
    script:
        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
        - cat dockerlogin.txt | docker login --username svwsnrw --password-stdin
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew :deployment:docker:dockerPushAllDockerhub

publish_github:
    stage: publish
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
    variables:
        SECURE_FILES_DOWNLOAD_PATH: '/'
    needs:
        - job: build
        - job: sign_artifacts
    script:
        - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
        - cat gradle_secure.properties >> gradle.properties
        - chmod +x ./deployment/setupVersion.sh
        - ./deployment/setupVersion.sh
        - ./gradlew :deployment:githubRelease

scheduled:cleanup-sonarqube:
    stage: scheduled
    before_script:
        - chmod +x ./.gitlab/.script/cleanup_orphan_sonarqube_mr_analyses.sh
    script:
        - ./.gitlab/.script/cleanup_orphan_sonarqube_mr_analyses.sh
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB_NAME == "cleanup-sonarqube"'
